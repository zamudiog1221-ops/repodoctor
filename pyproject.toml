[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "setupdoctor"
version = "0.3.0"
description = "Read a repo's setup requirements from its code and check them against your machine."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.urls]
Repository = "https://github.com/zamudiog1221-ops/setupdoctor"

[project.scripts]
setupdoctor = "setupdoctor:main"

[tool.setuptools]
py-modules = ["setupdoctor"]
