name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13"]
        include:
          - os: ubuntu-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        shell: bash
        env:
          # the end-to-end tests download packages, so they only run here
          SETUPDOCTOR_INTEGRATION: "1"
          # only the Linux runners have a Docker engine that can run Linux images
          SETUPDOCTOR_DOCKER: ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.13' && '1' || '' }}
        run: |
          set -o pipefail
          if ! python test_setupdoctor.py 2>&1 | tee out.txt; then
            msg=$(tail -n 40 out.txt)
            msg="${msg//'%'/'%25'}"; msg="${msg//$'\r'/}"; msg="${msg//$'\n'/'%0A'}"
            echo "::error title=tests failed on ${{ matrix.os }} python ${{ matrix.python }}::$msg"
            exit 1
          fi
